<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporizador · Política Comparada I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --morado:#723b8f;
  --lila:#d9b8ec;
  --navy:#163554;
  --navy-osc:#0e223b;
  --panel:rgba(8,22,40,.55);
  --linea:rgba(255,255,255,.28);
  --texto:#ffffff;
  --fuente:"Poppins","Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--navy-osc)}
body{
  margin:0;min-height:100%;color:var(--texto);font-family:var(--fuente);
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-osc) 100%) fixed;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}

/* Banda blanca con el sello de la Facultad */
header{background:#fff;position:sticky;top:0;z-index:20;padding:clamp(8px,1.6vh,20px) clamp(16px,4vw,48px)}
header img{display:block;height:clamp(44px,8vh,84px);width:auto;max-width:100%;mix-blend-mode:multiply}

/* Título */
.titulo{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:clamp(8px,1.8vh,24px) clamp(16px,4vw,48px) 0}
.titulo h1{
  margin:0;font-weight:700;font-size:clamp(1.05rem,min(3.6vw,4.2vh),2.2rem);line-height:1.1;letter-spacing:.01em;
  text-transform:uppercase;background:var(--panel);padding:.35em .6em;
}
.link{
  font:600 .9rem var(--fuente);color:var(--texto);background:none;border:0;
  padding:8px 0;cursor:pointer;border-bottom:2px solid var(--linea);white-space:nowrap;
}
.link:hover{border-color:var(--lila)}

/* Reloj */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(4px,1vh,16px) clamp(16px,4vw,48px) clamp(12px,2vh,28px)}
#reloj{
  display:flex;justify-content:center;align-items:center;
  font-weight:800;color:#fff;line-height:1;letter-spacing:0;
  font-size:min(26vw,30vh,20rem);
  transition:color .3s;user-select:none;
}
#reloj.largo{font-size:min(15.5vw,24vh,13rem)}
#reloj.final{color:var(--lila)}
#reloj .d{display:inline-block;width:.64em;text-align:center}
#reloj .c{display:inline-block;width:.34em;text-align:center;position:relative;top:-.06em}

/* Mosaico de progreso */
#mosaico{display:flex;gap:clamp(3px,.6vw,7px);width:min(100%,760px);margin-top:clamp(8px,1.8vh,20px)}
#mosaico i{flex:1;aspect-ratio:1;background:var(--c);border-radius:20%;transition:background-color .4s}
#mosaico i.gastado{background:rgba(255,255,255,.1)}

/* Controles */
.panel{width:min(100%,760px);margin-top:clamp(12px,2.4vh,28px);display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px)}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-weight:600;font-size:.82rem;color:#fff}
.campo input{
  width:clamp(72px,16vw,104px);font:700 clamp(1.5rem,4vw,2.2rem)/1 var(--fuente);
  color:#fff;background:var(--panel);border:2px solid var(--linea);border-radius:16px;
  padding:clamp(6px,1.2vh,12px) 8px;text-align:center;-moz-appearance:textfield;
}
.campo input::-webkit-outer-spin-button,.campo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.campo input:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.campo input:focus{border-color:var(--lila)}
.campo input:disabled{opacity:.5}
.sep{font:700 1.8rem/1 var(--fuente);padding-bottom:14px;color:var(--linea)}

.rapidos{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.rapidos button{
  font:600 .95rem var(--fuente);color:#fff;background:var(--panel);border:2px solid var(--linea);
  padding:10px 14px;cursor:pointer;border-radius:999px;
}
.rapidos button:hover:not(:disabled){border-color:var(--lila)}
.rapidos button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado)}
.rapidos button:disabled{opacity:.45;cursor:not-allowed}

.acciones{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{
  font:700 1.2rem var(--fuente);padding:clamp(10px,1.8vh,16px) 32px;cursor:pointer;border-radius:16px;border:2px solid #fff;
  background:transparent;color:#fff;min-width:150px;
}
.btn.principal{background:var(--morado);border-color:var(--morado)}
.btn.principal:hover{background:#8447a5;border-color:#8447a5}
.btn:hover:not(.principal):not(:disabled){background:rgba(255,255,255,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acciones .link{margin-left:auto}

/* Pantalla final */
#fin{
  position:fixed;inset:0;z-index:50;background:var(--morado);color:#fff;
  display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;overflow:hidden;
}
#fin.visible{display:flex}
#fin h2{
  margin:0;font-weight:800;line-height:.95;letter-spacing:-.02em;
  font-size:clamp(3rem,14vw,13rem);position:relative;z-index:2;
}
#fin h2 span{display:block}
#fin .cerrar{position:relative;z-index:2;margin-top:clamp(20px,5vh,48px);background:#fff;border-color:#fff;color:var(--morado)}
#fin .cerrar:hover{background:var(--lila);border-color:var(--lila)}
#fin .pie{
  position:absolute;left:0;right:0;bottom:0;background:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;z-index:2;
}
#fin .pie img{height:clamp(40px,7vw,64px);width:auto;max-width:100%;display:block}
.cuadro{position:absolute;width:clamp(36px,9vw,120px);aspect-ratio:1;background:var(--c);border-radius:18%;z-index:1}
#fin.visible .cuadro{animation:aparece .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--t,0s)}
@keyframes aparece{from{transform:scale(0)}to{transform:scale(1)}}

@media (max-width:560px){
  .rapidos{margin-left:0}
  .btn{flex:1;min-width:0;padding:16px 12px}
  .acciones .link{margin-left:0}
  .titulo{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  #fin.visible .cuadro{animation:none}
}
</style>
</head>

<script>
(function(){
  var COLORES=["#8e4fb3","#b07ccf","#e9d3f5","#5f7da3"];
  var N=20;
  var $=function(id){return document.getElementById(id)};
  var reloj=$("reloj"),mosaico=$("mosaico"),fin=$("fin");
  var inH=$("h"),inM=$("m"),inS=$("s"),btnInicio=$("inicio"),btnReiniciar=$("reiniciar");
  var rapidos=$("rapidos");

  var estado="listo";      // listo | corriendo | pausa | fin
  var total=0;             // segundos configurados
  var restanteMs=0, finTs=0, timer=null, ultimo="";
  var audio=null, master=null, sonando=false;

  /* ---------- Mosaico ---------- */
  var cuadros=[];
  for(var i=0;i<N;i++){
    var q=document.createElement("i");
    q.style.setProperty("--c",COLORES[i%COLORES.length]);
    mosaico.appendChild(q);cuadros.push(q);
  }
  function pintarMosaico(frac){
    var vivos=Math.ceil(frac*N-1e-9);
    for(var i=0;i<N;i++){cuadros[i].classList.toggle("gastado",i>=vivos)}
  }

  /* ---------- Configuración ---------- */
  function clamp(v,max){v=parseInt(v,10);if(isNaN(v)||v<0)v=0;return Math.min(v,max)}
  function leerConfig(){
    return clamp(inH.value,99)*3600+clamp(inM.value,59)*60+clamp(inS.value,59);
  }
  function escribirConfig(seg){
    inH.value=Math.floor(seg/3600);
    inM.value=Math.floor(seg%3600/60);
    inS.value=seg%60;
  }
  function marcarRapido(){
    var seg=leerConfig();
    Array.prototype.forEach.call(rapidos.children,function(b){
      b.setAttribute("aria-pressed",String(parseInt(b.dataset.min,10)*60===seg));
    });
  }

  /* ---------- Visualización ---------- */
  function pad(n){return n<10?"0"+n:""+n}
  function dibujar(seg){
    var h=Math.floor(seg/3600),m=Math.floor(seg%3600/60),s=seg%60;
    var largo=total>=3600||h>0;
    var txt=(largo?pad(h)+":":"")+pad(m)+":"+pad(s);
    if(txt!==ultimo){
      ultimo=txt;
      var html="";
      for(var i=0;i<txt.length;i++){
        var ch=txt.charAt(i);
        html+=ch===":"?'<span class="c">:</span>':'<span class="d">'+ch+'</span>';
      }
      reloj.innerHTML=html;
      reloj.setAttribute("aria-label","Tiempo restante "+txt);
      document.title=(estado==="corriendo"||estado==="pausa"?txt+" · ":"")+"Temporizador · Política Comparada I";
    }
    reloj.classList.toggle("largo",largo);
    reloj.classList.toggle("final",(estado==="corriendo"||estado==="pausa")&&seg<=10&&total>10);
  }

  function bloquear(b){
    [inH,inM,inS].forEach(function(i){i.disabled=b});
    Array.prototype.forEach.call(rapidos.children,function(x){x.disabled=b});
  }

  function aListo(){
    detener();
    estado="listo";
    total=leerConfig();
    restanteMs=total*1000;
    bloquear(false);
    btnInicio.textContent="Iniciar";
    btnInicio.disabled=total===0;
    dibujar(total);pintarMosaico(1);marcarRapido();
  }

  /* ---------- Cuenta atrás ---------- */
  function detener(){if(timer){clearInterval(timer);timer=null}}
  function tick(){
    restanteMs=Math.max(0,finTs-Date.now());
    var seg=Math.ceil(restanteMs/1000);
    dibujar(seg);
    pintarMosaico(total?restanteMs/(total*1000):0);
    if(restanteMs<=0){terminar()}
  }
  function iniciar(){
    if(estado==="listo"){total=leerConfig();if(total===0)return;restanteMs=total*1000}
    prepararAudio();
    estado="corriendo";
    finTs=Date.now()+restanteMs;
    bloquear(true);
    btnInicio.textContent="Pausar";
    detener();timer=setInterval(tick,100);tick();
  }
  function pausar(){
    detener();
    restanteMs=Math.max(0,finTs-Date.now());
    estado="pausa";
    btnInicio.textContent="Continuar";
  }
  function terminar(){
    detener();
    estado="fin";
    dibujar(0);pintarMosaico(0);
    fin.classList.add("visible");fin.setAttribute("aria-hidden","false");
    document.title="Tiempo Cumplido · Política Comparada I";
    sonar();
    setTimeout(function(){$("cerrar").focus()},50);
  }
  function cerrarFin(){
    apagarSonido();
    fin.classList.remove("visible");fin.setAttribute("aria-hidden","true");
    aListo();
  }

  /* ---------- Sonido (Web Audio) ---------- */
  function prepararAudio(){
    try{
      if(!audio){
        var AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return;
        audio=new AC();
      }
      if(audio.state==="suspended")audio.resume();
    }catch(e){}
  }
  function campana(ctx,destino,freq,t0,vol){
    // Campana sintetizada: fundamental + armónicos con caída exponencial
    var parciales=[[1,1,2.4],[2.01,.45,1.6],[3.02,.22,1.0],[4.2,.12,.6]];
    parciales.forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=freq*p[0];
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol*p[1],t0+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+p[2]);
      o.connect(g);g.connect(destino);
      o.start(t0);o.stop(t0+p[2]+.05);
    });
  }
  function sonar(){
    prepararAudio();
    if(!audio)return;
    try{
      apagarSonido();
      master=audio.createGain();master.gain.value=.55;master.connect(audio.destination);
      var t=audio.currentTime+.05;
      var notas=[784,987.77,1174.66,1567.98]; // Sol - Si - Re - Sol (acorde mayor ascendente)
      for(var r=0;r<3;r++){
        notas.forEach(function(f,i){campana(audio,master,f,t+r*1.7+i*.24,.5)});
        campana(audio,master,392,t+r*1.7+.96,.45);
      }
      sonando=true;
    }catch(e){}
  }
  function apagarSonido(){
    if(master&&sonando){
      try{master.gain.cancelScheduledValues(audio.currentTime);master.gain.setTargetAtTime(0,audio.currentTime,.05)}catch(e){}
    }
    sonando=false;
  }

  /* ---------- Eventos ---------- */
  [inH,inM,inS].forEach(function(i){
    i.addEventListener("input",function(){if(estado==="listo")aListo()});
    i.addEventListener("blur",function(){
      var max=i===inH?99:59;i.value=clamp(i.value,max);if(estado==="listo")aListo();
    });
    i.addEventListener("focus",function(){i.select()});
  });
  rapidos.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b||b.disabled)return;
    escribirConfig(parseInt(b.dataset.min,10)*60);aListo();
  });
  btnInicio.addEventListener("click",function(){
    if(estado==="corriendo")pausar();else iniciar();
  });
  btnReiniciar.addEventListener("click",function(){aListo()});
  $("cerrar").addEventListener("click",cerrarFin);
  $("probar").addEventListener("click",function(){
    prepararAudio();sonar();
    setTimeout(apagarSonido,2200);
  });
  $("pantalla").addEventListener("click",function(){
    var d=document;
    if(d.fullscreenElement){d.exitFullscreen()}
    else if(d.documentElement.requestFullscreen){d.documentElement.requestFullscreen().catch(function(){})}
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&estado==="fin"){cerrarFin();return}
    var tag=(e.target.tagName||"").toLowerCase();
    if(e.code==="Space"&&tag!=="input"&&tag!=="button"&&estado!=="fin"){
      e.preventDefault();btnInicio.click();
    }
  });
  // Al volver a la pestaña, recalcular de inmediato
  document.addEventListener("visibilitychange",function(){if(estado==="corriendo")tick()});

  aListo();
})();
</script>
</body>
</html>
